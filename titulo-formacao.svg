<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="Formação">
  <!--
    TÍTULO DE SEÇÃO (estilo minimalista)
    ✏️ Para editar: troque o número em id="num" e o nome em id="nome".
       Cores no bloco style (variáveis no seletor svg).
  -->
  <style>
    svg { --bg:#000000; --fg:#f2f2f2; --muted:#7a7a7a; --line:#1f1f1f; --red:#ff2a2a; --font:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    text { font-family: var(--font); }
    .num  { fill: var(--red); font-size: 12px; letter-spacing: 2px; }
    .nome { fill: var(--fg); font-size: 17px; font-weight: 600; letter-spacing: 7px; }
    .a    { opacity: 0; animation: surgir .8s ease-out .2s forwards; }
    .base { stroke: var(--line); stroke-width: 1; }
    .draw { stroke: var(--red); stroke-width: 1.5; stroke-dasharray: 120; stroke-dashoffset: 120;
             animation: tracar 1s cubic-bezier(.6,0,.2,1) .5s forwards; }
    @keyframes surgir { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes tracar { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .a { opacity: 1 !important; } .draw { stroke-dashoffset: 0 !important; } }
  </style>
  <rect width="900" height="64" rx="6" fill="var(--bg)"/>
  <text id="num"  class="num a"  x="24" y="38">03</text>
  <text id="nome" class="nome a" x="64" y="39">FORMAÇÃO</text>
  <line class="base" x1="24" y1="52" x2="876" y2="52"/>
  <line class="draw" x1="24" y1="52" x2="144" y2="52"/>
</svg>
