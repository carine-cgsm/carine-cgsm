<svg xmlns="http://www.w3.org/2000/svg" width="900" height="16" viewBox="0 0 900 16" role="img" aria-label="divisor">
  <!-- ✏️ Divisor vermelho pulsante. Troque a cor no stop-color #ff2a2a. -->
  <defs>
    <filter id="g" x="-10%" y="-300%" width="120%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="f" x1="0" x2="1">
      <stop offset="0" stop-color="#ff2a2a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff2a2a"/>
      <stop offset="1" stop-color="#ff2a2a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .l { animation: p 3s ease-in-out infinite; }
    @keyframes p { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; } }
  </style>
  <g class="l">
    <rect x="60" y="6" width="780" height="4" fill="url(#f)" filter="url(#g)"/>
    <rect x="60" y="7.25" width="780" height="1.5" fill="url(#f)"/>
  </g>
</svg>
