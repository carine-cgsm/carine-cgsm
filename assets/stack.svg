<svg xmlns="http://www.w3.org/2000/svg" width="900" height="286" viewBox="0 0 900 286" role="img" aria-label="Stack de tecnologias">
  <!--
    STACK (estilo minimalista)
    ✏️ Para editar: cada linha é um bloco <g>.
       • Categoria ...... texto em <text class="lbl">
       • Tecnologias .... texto em <text class="val"> (separe com " · ")
       Para adicionar uma linha, copie um <g>, some 44 nos "y" e .12s no delay,
       e aumente height/viewBox em 44.
  -->
  <style>
    svg { --bg:#000000; --fg:#f2f2f2; --muted:#7a7a7a; --line:#1f1f1f; --red:#ff2a2a; --font:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    text { font-family: var(--font); }
    .lbl { fill: var(--muted); font-size: 11px; letter-spacing: 3px; }
    .val { fill: var(--fg); font-size: 14px; }
    .sep { stroke: var(--line); stroke-width: 1; }
    .a   { opacity: 0; animation: surgir .6s ease-out forwards; }
    @keyframes surgir { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .a { opacity: 1 !important; } .draw { stroke-dashoffset: 0 !important; } }
  </style>
  <rect width="900" height="286" rx="6" fill="var(--bg)"/>
  <g class="a" style="animation-delay:0.20s">
    <text class="lbl" x="24" y="36">LINGUAGENS</text>
    <text class="val" x="260" y="36">PHP · JavaScript · Java · PDO</text>
    <line class="sep" x1="24" y1="52" x2="876" y2="52"/>
  </g>
  <g class="a" style="animation-delay:0.32s">
    <text class="lbl" x="24" y="80">DADOS</text>
    <text class="val" x="260" y="80">MySQL · SQL Server</text>
    <line class="sep" x1="24" y1="96" x2="876" y2="96"/>
  </g>
  <g class="a" style="animation-delay:0.44s">
    <text class="lbl" x="24" y="124">INTEGRAÇÕES &amp; APIS</text>
    <text class="val" x="260" y="124">REST · JSON · Postman · AJAX</text>
    <line class="sep" x1="24" y1="140" x2="876" y2="140"/>
  </g>
  <g class="a" style="animation-delay:0.56s">
    <text class="lbl" x="24" y="168">FRONT-END</text>
    <text class="val" x="260" y="168">Bootstrap · DataTables · React</text>
    <line class="sep" x1="24" y1="184" x2="876" y2="184"/>
  </g>
  <g class="a" style="animation-delay:0.68s">
    <text class="lbl" x="24" y="212">CLOUD &amp; PLATAFORMA</text>
    <text class="val" x="260" y="212">Azure · Docker</text>
    <line class="sep" x1="24" y1="228" x2="876" y2="228"/>
  </g>
  <g class="a" style="animation-delay:0.80s">
    <text class="lbl" x="24" y="256">TOOLS</text>
    <text class="val" x="260" y="256">Git · GitHub · GitLab · VS Code · Chrome DevTools</text>
    <line class="sep" x1="24" y1="272" x2="876" y2="272"/>
  </g>
</svg>
