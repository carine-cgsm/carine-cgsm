<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Carine Gomes — Desenvolvedor Full Stack e entusiasta por tecnologia">
  <!--
    ============================================================
    HEADER ANIMADO — Carine Gomes
    ✏️ Para editar:
      • Cores ............ variáveis no bloco <style> (bloco "svg { ... }")
      • Nome ............. procure por  id="nome"
      • Cargo ............ procure por  id="cargo"
      • Linha de status .. procure por  id="status"
      • Tempos ........... animation-delay de cada classe
    ============================================================
  -->
  <defs>
    <filter id="brilho" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="varredura" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2a2a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2a2a" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="vinheta" cx="50%" cy="50%" r="70%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
  </defs>

  <style>
    svg {
      --bg: #000000;      /* fundo            */
      --red: #ff2a2a;     /* vermelho principal */
      --red-dim: #3a0000; /* borda / detalhes   */
      --white: #f2f2f2;   /* texto principal    */
      --gray: #8a8a8a;    /* texto secundário   */
      --font: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    text { font-family: var(--font); }

    /* Estrelas piscando */
    .star { fill: var(--white); opacity: .15; animation: piscar 4s ease-in-out infinite; }
    @keyframes piscar { 0%,100% { opacity: .12; } 50% { opacity: .75; } }

    /* Varredura de segurança (passa uma vez no início) */
    .scan { animation: varrer 1.6s ease-in-out .1s 1 forwards; transform: translateY(-120px); opacity: 0; }
    @keyframes varrer {
      0%   { transform: translateY(-120px); opacity: 0; }
      15%  { opacity: 1; }
      100% { transform: translateY(260px); opacity: 0; }
    }

    /* Feixe vermelho acendendo + pulsação contínua */
    .beam, .beam-glow {
      stroke: var(--red); stroke-linecap: round;
      stroke-dasharray: 560; stroke-dashoffset: 560;
      animation: acender 1.1s cubic-bezier(.7,0,.3,1) .5s forwards,
                 pulsar 2.6s ease-in-out 1.8s infinite;
    }
    .beam { stroke-width: 3; }
    .beam-glow { stroke-width: 10; opacity: .7; }
    @keyframes acender { to { stroke-dashoffset: 0; } }
    @keyframes pulsar { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

    /* Textos surgindo */
    .nome   { fill: var(--white); font-size: 46px; font-weight: 700; letter-spacing: 10px;
              opacity: 0; animation: revelar 1.2s ease-out 1.3s forwards; }
    .cargo  { fill: var(--gray); font-size: 14px; letter-spacing: 4px;
              opacity: 0; animation: surgir .9s ease-out 2.1s forwards; }
    .status { fill: var(--red); font-size: 12px; letter-spacing: 2px;
              opacity: 0; animation: surgir .9s ease-out 2.7s forwards; }
    .ponto  { fill: var(--red); opacity: 0; animation: surgir .9s ease-out 2.7s forwards, piscar-ponto 1.4s ease-in-out 3.6s infinite; }
    @keyframes revelar { from { opacity: 0; letter-spacing: 26px; } to { opacity: 1; letter-spacing: 10px; } }
    @keyframes surgir  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes piscar-ponto { 0%,100% { opacity: 1; } 50% { opacity: .2; } }

    /* Acessibilidade: sem animação para quem preferir */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .beam, .beam-glow { stroke-dashoffset: 0; }
      .nome, .cargo, .status, .ponto { opacity: 1; }
      .scan { opacity: 0; }
    }
  </style>

  <!-- Fundo -->
  <rect width="900" height="260" rx="10" fill="var(--bg)"/>

  <!-- Campo de estrelas (adicione/remova círculos à vontade) -->
  <g>
    <circle class="star" cx="42"  cy="30"  r="1"   style="animation-delay:.2s"/>
    <circle class="star" cx="118" cy="72"  r="1.3" style="animation-delay:1.1s"/>
    <circle class="star" cx="76"  cy="190" r="1"   style="animation-delay:2.3s"/>
    <circle class="star" cx="160" cy="232" r="1.2" style="animation-delay:.7s"/>
    <circle class="star" cx="210" cy="28"  r="1"   style="animation-delay:3.1s"/>
    <circle class="star" cx="265" cy="214" r="1"   style="animation-delay:1.7s"/>
    <circle class="star" cx="320" cy="46"  r="1.4" style="animation-delay:2.8s"/>
    <circle class="star" cx="372" cy="238" r="1"   style="animation-delay:.4s"/>
    <circle class="star" cx="430" cy="20"  r="1"   style="animation-delay:1.9s"/>
    <circle class="star" cx="498" cy="226" r="1.2" style="animation-delay:3.4s"/>
    <circle class="star" cx="556" cy="38"  r="1"   style="animation-delay:.9s"/>
    <circle class="star" cx="610" cy="242" r="1"   style="animation-delay:2.1s"/>
    <circle class="star" cx="668" cy="58"  r="1.3" style="animation-delay:1.3s"/>
    <circle class="star" cx="720" cy="218" r="1"   style="animation-delay:3.7s"/>
    <circle class="star" cx="772" cy="26"  r="1"   style="animation-delay:.1s"/>
    <circle class="star" cx="820" cy="120" r="1.4" style="animation-delay:2.6s"/>
    <circle class="star" cx="858" cy="44"  r="1"   style="animation-delay:1.5s"/>
    <circle class="star" cx="842" cy="210" r="1"   style="animation-delay:3.0s"/>
    <circle class="star" cx="30"  cy="120" r="1.2" style="animation-delay:2.0s"/>
    <circle class="star" cx="890" cy="160" r="1"   style="animation-delay:.6s"/>
    <circle class="star" cx="140" cy="140" r=".8"  style="animation-delay:3.3s"/>
    <circle class="star" cx="760" cy="150" r=".8"  style="animation-delay:1.0s"/>
  </g>

  <!-- Varredura vermelha -->
  <rect class="scan" x="0" y="0" width="900" height="110" fill="url(#varredura)"/>

  <!-- Nome -->
  <text id="nome" class="nome" x="450" y="108" text-anchor="middle">CARINE GOMES</text>

  <!-- Cargo -->
  <text id="cargo" class="cargo" x="450" y="142" text-anchor="middle">DESENVOLVEDOR FULL STACK · ENTUSIASTA POR TECNOLOGIA</text>

  <!-- Feixe vermelho -->
  <line class="beam-glow" x1="170" y1="172" x2="730" y2="172" filter="url(#brilho)"/>
  <line class="beam"      x1="170" y1="172" x2="730" y2="172"/>

  <!-- Linha de status -->
  <circle class="ponto" cx="254" cy="211" r="4"/>
  <text id="status" class="status" x="268" y="215">ACESSO AUTORIZADO  ·  CONEXÃO SEGURA  ·  RS — BRASIL</text>

  <!-- Vinheta + borda -->
  <rect width="900" height="260" rx="10" fill="url(#vinheta)" pointer-events="none"/>
  <rect x=".5" y=".5" width="899" height="259" rx="10" fill="none" stroke="var(--red-dim)"/>
</svg>
